<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>멈추어라 순간이여!</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            width: 1500px;
            height: 2000px;
            background-image: url('img/couleur-waves-1215449_1920.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .fll{
            background: #fff;
            width: 1500px;
            height: 500px;
            margin-top: 400px;
        }

        .injang{
            background-image: url('img/pexels-ocean-1838340_1920.jpg');
            border-radius: 100%;
            background-size: cover;
            width: 200px; 
            height:200px;
            transform: translate(50px, -100px);
            border: 4px solid #fff;
        }
    </style>
</head>
<body>
    <div class="fll">
        <div class="injang"></div>
        <h1>애프입니다</h1>
    </div>
</body>
</html>
