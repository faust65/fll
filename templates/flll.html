<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세션 일정 및 현황</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-image: url('./static/img/couleur-waves-1215449_1920.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            width: 1500px;
            height: 2500px;
        }

        .cld{
            margin-top: 100px;
            padding-top: 100px;
            padding-bottom: 100px;
            background-color: rgba(255, 255, 255, 0.596);
            width: 1500px;
            height: 1000px;
        }

        .hd{
            display: flex;
            justify-content: space-around;
            margin-top: 100px;
            margin-bottom: 100px;
        }

        .ds{
            display: grid;
            grid-template-columns: repeat(7,1fr);
            grid-template-rows: repeat(6,minmax(100px, auto));
            margin-left: 100px;
        }

        .wk{
            display: grid;
            place-items: center;
            grid-template-columns: repeat(7,1fr);
            margin-bottom: 50px;
            margin-left: 100px;
        }

        .scnr{
            margin-top: 100px;
            padding-top: 50px;
            padding-bottom: 100px;
            background-color: rgba(255, 255, 255, 0.596);
            width: 1500px;
            height: 1500px;
        }

        .scnr div{
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .schd{
            display: grid;
            place-items: center;
            grid-template-columns: repeat(4,1fr);
            padding-bottom: 50px;
        }

        .scs{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            place-items: center;
        }
    </style>
</head>
<body>
    <div class="cld">
        <div class="hd">
            <button class="pre">◀</button>
            <h2 class="my"></h2>
            <button class="nxt">▶</button>
        </div>

        <div class="wk">
            <div class="">일</div>
            <div class="">월</div>
            <div class="">화</div>
            <div class="">수</div>
            <div class="">목</div>
            <div class="">금</div>
            <div class="">토</div>
        </div>

        <div class="ds"></div>
    </div>

    <div class="scnr">
        <div class="schd">
            <div class="sname">시나리오명/라이터</div>
            <div class="tname">탁 이름</div>
            <div class="gmpl">GM/PL</div>
            <div class="wanz">완주여부</div>
        </div>

        <div class="scs"></div>
    </div>

    <script>
        let my=document.querySelector(".my");
        let ds=document.querySelector(".ds");
        let scs=document.querySelector(".scs");

        let cd=new Date();
        let scsa=new Array("Abyss's 3부작","거북이탁(임시)","GMHO","예정","Abyss's 3부작","에바스헌터즈","GMHO","예정","Abyss's 3부작","침수탁(임시)","GM","예정","Abyss's 3부작","야차탁(임시)","GM","예정","Abyss's 3부작","니알라토텝(임시)","GM","예정","Abyss's 3부작","출근탁(임시)","GM","예정","Abyss's 3부작","생선탁(임시)","GM","예정","Abyss's 3부작","닭새우(편의상 명칭)","PL","예정","그레모리의 아이들","그레모리의 인성들","PL","현행","그레모리의 아이들","커스타드","GM","현행","쾌도난마","칼찌탁(편의상 명칭)","PL","예정","사계배웅","중환자탁(편의상 명칭)","PL","예정","EDIBLE","케이크탁(임시)","GM","예정","EDIBLE","식빵탁(임시)","GMHO","예정","아스트룸의 항해사","드라우닝(임시)","GM","예정","Tempest Funeralists","부대찌개","라이터/GM","집필중","VOID","CHIz","PL","완주","VOID","2050년(편의상 명칭)","PL","예정","VOID","아니되옴탁(편의상 명칭)","PL","예정","VOID","똥이드","PL","현행","VOID","경시청메워(임시)","GMHO","예정","VOID","우메보시탁(임시)","GMHO","현행","우리가 정의하는 것","숨도쉬지마(임시)","GM","예정","천적의 세","오우X발밥(편의상 명칭)","PL","현행","웨스턴유로 특급열차 살인사건","대머리탁(편의상 명칭)","PL","예정","내리쬐는 아침햇살, 스러지는 봄바람에","뜨바람","PL","현행","크립트바운드","크립바이크","PL","현행","크립트바운드","영크크","GM","예정","크립트바운드","은교바운드(편의상 명칭)","PL","현행"); 
        // 여기 괄호에 시날명 탁명 GMPL 완주여부 순서로 입력

        function calr() {
            ds.innerHTML="";

            let year = cd.getFullYear();
            let month = cd.getMonth();
            let fd = new Date(year, month, 1).getDay();
            let dts = new Date(year, month + 1, 0).getDate();

            my.innerText =`${year}년 ${month+1}월`;

            for(i=0;i<fd;i++){
                ds.innerHTML += "<div></div>";
            }

            for(i=1;i<=dts;i++){
                let div = document.createElement("div");
                div.innerText = i;
                // if(month+1== && i==){}
                ds.appendChild(div);
            }
        }

        function scsr() {
            for(i=0;i<116;i++){ // 다녀온 시나리오 개수*4만큼 i 조건식
                let div = document.createElement("div");
                div.innerText = scsa[i];
                scs.appendChild(div);
            }
        }

        calr();
        scsr();

        document.querySelector(".pre").onclick=()=>{
            cd.setMonth(cd.getMonth()-1);
            calr();
        }     

        document.querySelector(".nxt").onclick=()=>{
            cd.setMonth(cd.getMonth()+1);
            calr();
        }     
    </script>
</body>
</html>
